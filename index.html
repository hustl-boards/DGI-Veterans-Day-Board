<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0c1220" />
  <link rel="icon" href="assets/dgi-logo-small-icon.png" />
  <title>David Gooding, Inc. Veterans Day Office TV</title>
  <link rel="stylesheet" href="styles.css?v=20261029a" />
</head>
<body>
  <main id="stage" aria-label="David Gooding, Inc. Veterans Day office slideshow">
    <video id="vid" class="clip" muted playsinline preload="none"></video>
    <video id="vid-next" class="clip" muted playsinline preload="none"></video>
    <div id="fade"></div>
    <div id="brand">
      <img src="assets/dgi-logo.png" alt="David Gooding, Inc." />
      <p id="brand-line">Thank you to all who served — from David Gooding, Inc.</p>
    </div>
    <div id="progress"><span></span></div>
    <div id="countdown" aria-live="off"></div>
    <div id="counter" aria-live="polite"></div>
    <div id="controls">
      <button id="prev" type="button" aria-label="Previous clip">◀</button>
      <button id="pause" type="button" aria-label="Pause slideshow">Ⅱ</button>
      <button id="next" type="button" aria-label="Next clip">▶</button>
      <button id="sound" type="button" aria-label="Turn sound on">🔇</button>
      <button id="full" type="button" aria-label="Fullscreen">⛶</button>
    </div>
  </main>
  <script src="clips.js"></script>
  <script src="app.js?v=20261029a"></script>
</body>
</html>
